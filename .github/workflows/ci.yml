name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # Integration tests hit a live Neon branch. The booking test imports the
      # db client and the redis-backed queue/event helpers, so env.ts requires
      # all three vars to be present (even though the test only exercises
      # DATABASE_URL). DATABASE_URL_CI must point at a disposable Neon branch;
      # REDIS_URL_CI and AUTH_SECRET_CI only need to be syntactically valid.
      - name: Test
        run: npm test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_CI }}
          REDIS_URL: ${{ secrets.REDIS_URL_CI }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET_CI }}
