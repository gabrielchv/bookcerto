name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # The booking test is an integration test against a real Neon branch: it
      # imports the db client and the redis-backed queue/event helpers, and
      # env.ts validates all three variables. When these secrets are absent the
      # test skips itself (and says so) instead of failing the unit suite during
      # env parsing. DATABASE_URL_CI must point at a disposable Neon branch;
      # REDIS_URL_CI and AUTH_SECRET_CI only need to be syntactically valid.
      # To require the integration test in CI, add all three secrets.
      - name: Test
        run: npm test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_CI }}
          REDIS_URL: ${{ secrets.REDIS_URL_CI }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET_CI }}
