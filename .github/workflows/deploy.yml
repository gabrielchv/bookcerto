name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REGION: us-central1
      REPO: bookcerto
      WEB_SERVICE: bookcerto-web
      WORKER_SERVICE: bookcerto-worker
      IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/bookcerto/app
      # Runtime service account for both Cloud Run services. Same identity Terraform
      # uses (var.service_account) and which holds roles/secretmanager.secretAccessor
      # on the mounted secrets. Reuses the WIF auth step's service account so the
      # deploy does not silently reset the revision to the default Compute Engine SA.
      SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Workload Identity Federation: no long-lived service account key.
      # Requires a WIF pool/provider bound to this repo plus the service
      # account granted roles/iam.workloadIdentityUser, roles/artifactregistry.writer,
      # roles/run.admin, roles/iam.serviceAccountUser and
      # roles/secretmanager.secretAccessor (the latter so the runtime SA can read the
      # mounted secrets). See task-13-report.md.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # `gcloud auth configure-docker` writes a credential helper buildx can't
      # read ("error getting credentials"), and docker/login-action's
      # ${{ steps.auth.outputs.access_token }} came back empty. Piping the token
      # from gcloud (already authenticated by the WIF creds file) to docker login
      # is the reliable path.
      - name: Login to Artifact Registry
        run: |
          gcloud auth print-access-token | \
            docker login -u oauth2accesstoken --password-stdin ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Run database migrations
        run: npx drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          # drizzle.config.ts imports env.ts, which zod-parses all three vars
          # even though migrate only touches DATABASE_URL. Placeholders satisfy
          # parsing; the real REDIS_URL/AUTH_SECRET live in Secret Manager.
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: migrate-only-placeholder-000000000000

      # --set-secrets mounts Secret Manager values at runtime. Secret names map to
      # the secret_ids Terraform (task-12 main.tf) provisions: database-url,
      # redis-url, auth-secret, all on version "latest". Without these the web
      # service boots with none of DATABASE_URL/REDIS_URL/AUTH_SECRET and env.ts
      # zod-parse fails on every route. --service-account must match the identity
      # Terraform grants roles/secretmanager.secretAccessor to (var.service_account),
      # else the mounted secrets are unreadable by the default Compute Engine SA.
      - name: Deploy web
        run: |
          gcloud run deploy ${{ env.WEB_SERVICE }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --service-account $SERVICE_ACCOUNT \
            --allow-unauthenticated \
            --set-secrets=DATABASE_URL=database-url:latest,REDIS_URL=redis-url:latest,AUTH_SECRET=auth-secret:latest

      # Worker is a Cloud Run *service*, matching terraform main.tf's
      # google_cloud_run_v2_service "worker" (command npx, args tsx/src/worker.ts,
      # min_instances 1). --no-cpu-throttling keeps it consuming the queue without
      # an inbound request. CAVEAT: the worker binds no HTTP port, so Cloud Run's
      # default readiness probe on :8080 will never pass and the revision never
      # becomes ready; terraform main.tf does not override the probe/port either,
      # so this must be fixed at the infra layer (startup_probe or a Job migration).
      - name: Deploy worker
        run: |
          gcloud run deploy ${{ env.WORKER_SERVICE }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --service-account $SERVICE_ACCOUNT \
            --command npx \
            --args "tsx,src/worker.ts" \
            --min-instances 1 \
            --no-cpu-throttling \
            --set-secrets=DATABASE_URL=database-url:latest,REDIS_URL=redis-url:latest,AUTH_SECRET=auth-secret:latest
